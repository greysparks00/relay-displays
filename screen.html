<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Relay Display</title>

    <link rel="stylesheet" href="/core.css">
    <script type="module" src="/server.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-brand">
            <div class="brand-icon">R_</div>

            <div class="brand-name">
                <strong>RELAY</strong>
                <span>/ INTERFACE</span>
            </div>
        </div>

        <div class="header-info">
            <h1 id="screen-status"></h1>

            <span class="status-dot"></span>
            <p id="status" role="status">DISCONNECTED</p>
        </div>
    </header>

    <form id="login">
        <label for="key">SCREEN AUTHENTICATION</label>
        <input
            type="password"
            id="key"
            placeholder="Enter screen key"
            required
            autocomplete="off"
        >
        <button type="submit">CONNECT</button>
    </form>

    <main id="payload" aria-live="polite"></main>
</body>
</html>
